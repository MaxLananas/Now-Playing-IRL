name: Build & Release
on:
  push: { branches: [main, master] }
  pull_request: { branches: [main, master] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: write }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.6",  yarn: "1.21.6+build.1",  fabric: "0.128.2+1.21.6" }
          - { mc: "1.21.7",  yarn: "1.21.7+build.1",  fabric: "0.129.0+1.21.7" }
          - { mc: "1.21.8",  yarn: "1.21.8+build.1",  fabric: "0.136.1+1.21.8" }
          - { mc: "1.21.9",  yarn: "1.21.9+build.1",  fabric: "0.134.1+1.21.9" }
          - { mc: "1.21.10", yarn: "1.21.10+build.3", fabric: "0.138.4+1.21.10" }
          - { mc: "1.21.11", yarn: "1.21.11+build.3", fabric: "0.140.2+1.21.11" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: "21", distribution: "microsoft" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.2.1" }
      - name: Build for MC ${{ matrix.mc }}
        run: |
          set -o pipefail
          gradle build --build-cache --parallel --console=plain -Pminecraft_version=${{ matrix.mc }} -Pyarn_mappings=${{ matrix.yarn }} -Pfabric_version=${{ matrix.fabric }} 2>&1 | tee build-output.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: "build-log-mc${{ matrix.mc }}", path: "build-output.txt" }
      - name: Post build log to PR (debug)
        if: failure() && github.event_name == 'pull_request'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          { echo "### ❌ Build log MC ${{ matrix.mc }}"; echo '```'; grep -E "error:|FAILED|What went wrong|Could not|Execution failed|Caused by|\.java:" build-output.txt | head -60; echo '```'; } > comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file comment.md
      - name: Rename jar per version
        run: |
          mkdir -p out
          for f in build/libs/*.jar; do case "$f" in *-sources.jar) ;; *) cp "$f" "out/now-playing-irl-$(grep '^mod_version' gradle.properties | cut -d= -f2)-mc${{ matrix.mc }}.jar";; esac; done
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: "now-playing-irl-mc${{ matrix.mc }}", path: "out/*.jar", if-no-files-found: error }
  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { pattern: "now-playing-irl-mc*", path: release-jars, merge-multiple: true }
      - name: Compute tag
        id: v
        run: |
          V=$(grep '^mod_version' gradle.properties | cut -d= -f2 | tr -d ' \r')
          echo "tag=v$V" >> $GITHUB_OUTPUT; echo "version=$V" >> $GITHUB_OUTPUT
          if git ls-remote --tags origin | grep -q "refs/tags/v$V$"; then echo "exists=true" >> $GITHUB_OUTPUT; else echo "exists=false" >> $GITHUB_OUTPUT; fi
      - name: Create GitHub Release (all Minecraft versions)
        if: steps.v.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: "Now Playing IRL ${{ steps.v.outputs.version }} — MC 1.21.6 → 1.21.11"
          body_path: RELEASE_NOTES.md
          files: "release-jars/*.jar"
          draft: false
          prerelease: false
          make_latest: true
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
