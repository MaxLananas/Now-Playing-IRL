plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral(); maven { url "https://maven.shedaniel.me/" }; maven { url "https://maven.terraformersmc.com/releases/" } }
loom { accessWidenerPath = file("src/main/resources/nowplayingirl.accesswidener") }
sourceSets { main { java { srcDirs = ['src/main/java', 'srcLegacy/java'] } } }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation("net.java.dev.jna:jna:5.14.0") // compile-only: at runtime we use Minecraft's own JNA (bundling ours shadows it and breaks oshi on 26.x)
    implementation("net.java.dev.jna:jna-platform:5.14.0")
    modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version, "java_version": 21,
               "loader_version": project.loader_version, "mixins_config": "nowplayingirl.mixins.json",
               "modmenu_entrypoints": '["com.nowplayingirl.client.config.ModMenuIntegration"]',
               "mc_dependency": ">=${project.minecraft_version}"
    }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 21; it.options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }
