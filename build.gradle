plugins {
    // Both loom flavours are put on the classpath; the right one is applied below
    // (remap = Yarn-era versions, plain = unobfuscated 26.x).
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
def isMojang = project.findProperty('target_api') == 'mojang'
def javaVer = (project.findProperty('java_version') ?: '21') as int
apply plugin: (isMojang ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap')
repositories { mavenCentral(); maven { url "https://maven.shedaniel.me/" }; maven { url "https://maven.terraformersmc.com/releases/" } }
loom {
    if (!isMojang) { accessWidenerPath = file("src/main/resources/nowplayingirl.accesswidener") }
}
// One source tree, two mapping generations:
//  - target_api=yarn   (MC 1.21.6-1.21.11, Java 21): legacy MC-facing classes from src/main
//  - target_api=mojang (MC 26.1+, Java 25, official Mojang names): MC-facing classes from src26
// Everything else (193-app registry, OS media detectors, config, themes) is shared.
sourceSets {
    main {
        java {
            if (isMojang) {
                srcDirs = ['src/main/java', 'src26/java']
                exclude 'com/nowplayingirl/client/NowPlayingClient.java'
                exclude 'com/nowplayingirl/client/KeyBindingCompat.java'
                exclude 'com/nowplayingirl/client/config/ConfigScreen.java'
                exclude 'com/nowplayingirl/client/config/ModMenuIntegration.java'
                exclude 'com/nowplayingirl/client/hud/NowPlayingHud.java'
                exclude 'com/nowplayingirl/client/media/MediaInfo.java'
                exclude 'com/nowplayingirl/client/media/AlbumArtFetcher.java'
                exclude 'com/nowplayingirl/mixin/HudMixin.java'
            }
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (isMojang) {
        implementation "net.fabricmc:fabric-loader:${project.loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    } else {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
        // ModMenu is optional at runtime: compile-only so one source builds every legacy version
        modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
    }
    include(implementation("net.java.dev.jna:jna:5.14.0"))
    include(implementation("net.java.dev.jna:jna-platform:5.14.0"))
}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "java_version", javaVer
    inputs.property "loader_version", project.loader_version
    inputs.property "mixins_config", isMojang ? "nowplayingirl26.mixins.json" : "nowplayingirl.mixins.json"
    inputs.property "modmenu_entrypoints", isMojang ? "[]" : '["com.nowplayingirl.client.config.ModMenuIntegration"]'
    inputs.property "mc_dependency", isMojang ? "~${project.minecraft_version}" : ">=${project.minecraft_version}"
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version, "java_version": javaVer,
               "loader_version": project.loader_version, "mixins_config": isMojang ? "nowplayingirl26.mixins.json" : "nowplayingirl.mixins.json",
               "modmenu_entrypoints": isMojang ? "[]" : '["com.nowplayingirl.client.config.ModMenuIntegration"]',
               "mc_dependency": isMojang ? "~${project.minecraft_version}" : ">=${project.minecraft_version}"
    }
}
tasks.withType(JavaCompile).configureEach { it.options.release = javaVer; it.options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.toVersion(javaVer); targetCompatibility = JavaVersion.toVersion(javaVer) }
jar { from("LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }
