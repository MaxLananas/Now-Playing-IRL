plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}
version = project.mod_version
group = "com.nowplayingirl"
base { archivesName = "now-playing-irl" }
repositories { mavenCentral() }
// Shared sources from the repo root, with the MC-facing classes replaced by their src26/ (Mojang mappings) variants.
sourceSets {
    main {
        java {
            srcDirs = ['../src/main/java', '../src26/java']
            exclude 'com/nowplayingirl/client/NowPlayingClient.java'
            exclude 'com/nowplayingirl/client/KeyBindingCompat.java'
            exclude 'com/nowplayingirl/client/config/ConfigScreen.java'
            exclude 'com/nowplayingirl/client/config/ModMenuIntegration.java'
            exclude 'com/nowplayingirl/client/hud/NowPlayingHud.java'
            exclude 'com/nowplayingirl/client/media/MediaInfo.java'
            exclude 'com/nowplayingirl/client/media/AlbumArtFetcher.java'
            exclude 'com/nowplayingirl/mixin/HudMixin.java'
        }
        resources { srcDirs = ['../src/main/resources'] }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include(implementation("net.java.dev.jna:jna:5.14.0"))
    include(implementation("net.java.dev.jna:jna-platform:5.14.0"))
}
processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "minecraft_version": project.minecraft_version, "java_version": 25,
               "loader_version": project.loader_version, "mixins_config": "nowplayingirl26.mixins.json",
               "modmenu_entrypoints": "[]",
               "mc_dependency": "~${project.minecraft_version}"
    }
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25; it.options.encoding = 'UTF-8' }
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
jar { from("../LICENSE") { rename { "${it}_${project.base.archivesName.get()}" } } }
